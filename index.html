<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The JK Espresso Tracker — Home</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="app-shell">
    <div class="page-header">
      <div class="eyebrow">Welcome back</div>
      <h1>Your espresso dashboard</h1>
      <p class="muted">Track every shot, dial in your beans, and never lose a great recipe.</p>
    </div>

    <div class="card-row" id="stats-row"></div>

    <div class="two-col section">
      <div>
        <div class="flex-between mb-16">
          <h2>Recent brews</h2>
          <a href="brew-log.html" class="btn btn-outline btn-sm">+ Log a brew</a>
        </div>
        <div class="brew-list" id="recent-brews"></div>
      </div>

      <div>
        <h2>Quick links</h2>
        <div class="card">
          <a href="brew-log.html">📝 Log a new brew</a><br><br>
          <a href="beans.html">🌱 Add a bean</a><br><br>
          <a href="recipes.html">📖 Browse recipes</a><br><br>
          <a href="discover.html">🗺️ Find new roasters</a><br><br>
          <a href="gear.html">⚙️ Browse gear</a><br><br>
          <a href="learn.html">🎓 Learn about coffee</a>
        </div>
      </div>
    </div>
  </main>

  <nav id="bottomnav"></nav>

  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud-data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
