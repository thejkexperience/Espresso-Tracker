<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The JK Espresso Tracker — Brew Log</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="app-shell">
    <div class="page-header">
      <div class="eyebrow">Brew log</div>
      <h1 id="form-title">Log a new brew</h1>
      <p class="muted">Capture everything about the shot so you can dial in next time.</p>
    </div>

    <form class="card" id="brew-form">
      <input type="hidden" id="brew-id" />

      <fieldset>
        <legend>Bean</legend>
        <div class="field-grid">
          <div class="field">
            <label for="bean-select">Choose from your bean library</label>
            <select id="bean-select"></select>
          </div>
          <div class="field">
            <label for="bean-name">Or type a bean name</label>
            <input type="text" id="bean-name" placeholder="e.g. Ethiopia Yirgacheffe" />
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Equipment</legend>
        <div class="field-grid">
          <div class="field">
            <label for="machine-type">Espresso machine</label>
            <input type="text" id="machine-type" placeholder="e.g. Breville Bambino Plus" />
          </div>
          <div class="field">
            <label for="grinder-type">Grinder</label>
            <input type="text" id="grinder-type" placeholder="e.g. Baratza Encore ESP" />
          </div>
          <div class="field">
            <label for="grind-size">Grind size setting</label>
            <input type="text" id="grind-size" placeholder="e.g. 12, or 'fine'" />
          </div>
          <div class="field">
            <label for="tools-used">Tools used</label>
            <input type="text" id="tools-used" placeholder="e.g. WDT tool, bottomless portafilter, scale" />
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Shot details</legend>
        <div class="field-grid">
          <div class="field">
            <label for="brew-date">Date</label>
            <input type="date" id="brew-date" />
          </div>
          <div class="field">
            <label for="brew-time-of-day">Time</label>
            <input type="time" id="brew-time-of-day" />
          </div>
          <div class="field">
            <label for="dose-weight">Dose weight (g in)</label>
            <input type="number" step="0.1" id="dose-weight" placeholder="18" />
          </div>
          <div class="field">
            <label for="yield-weight">Yield weight (g out)</label>
            <input type="number" step="0.1" id="yield-weight" placeholder="36" />
          </div>
          <div class="field">
            <label for="brew-time">Brew time (seconds)</label>
            <input type="number" step="1" id="brew-time" placeholder="27" />
          </div>
          <div class="field">
            <label for="water-temp">Water temp (°F, optional)</label>
            <input type="number" step="1" id="water-temp" placeholder="200" />
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Photos (optional)</legend>
        <p class="muted" style="margin-top:-4px;">Stored privately in your account — only you can see them.</p>
        <div class="field-grid">
          <div class="field">
            <label for="photo-shot">Shot pour</label>
            <div class="photo-preview" id="photo-shot-preview"></div>
            <input type="file" id="photo-shot" accept="image/*" capture="environment" />
          </div>
          <div class="field">
            <label for="photo-puck">Puck</label>
            <div class="photo-preview" id="photo-puck-preview"></div>
            <input type="file" id="photo-puck" accept="image/*" capture="environment" />
          </div>
          <div class="field">
            <label for="photo-packaging">Packaging</label>
            <div class="photo-preview" id="photo-packaging-preview"></div>
            <input type="file" id="photo-packaging" accept="image/*" capture="environment" />
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Feedback &amp; next steps</legend>
        <div class="field">
          <label>Rating</label>
          <div class="rating-input" id="rating-input"></div>
        </div>
        <div class="field">
          <label for="feedback">How did it taste? Feedback on this brew</label>
          <textarea id="feedback" placeholder="e.g. Bright, a little sour, chocolate finish but thin body..."></textarea>
        </div>
        <div class="field">
          <label for="recommendation">Recommendation for next brew</label>
          <textarea id="recommendation" placeholder="e.g. Grind slightly finer to slow the shot and add body..."></textarea>
        </div>
      </fieldset>

      <div class="flex gap-8">
        <button type="submit" class="btn btn-primary">Save brew</button>
        <button type="button" class="btn btn-outline" id="cancel-edit" style="display:none;">Cancel edit</button>
        <button type="button" class="btn btn-danger" id="delete-brew" style="display:none;">Delete</button>
      </div>
    </form>

    <div class="section">
      <div class="toolbar">
        <h2 style="margin:0;">Brew history</h2>
        <div class="spacer"></div>
        <input type="search" id="search-brews" placeholder="Search by bean, machine, notes..." />
        <select id="sort-brews">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="rating-desc">Highest rated</option>
        </select>
      </div>
      <div class="brew-list" id="brew-history"></div>
    </div>
  </main>

  <nav id="bottomnav"></nav>

  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud-data.js"></script>
  <script src="js/brew-log.js"></script>
</body>
</html>
