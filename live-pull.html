<body class="page-livepull">
  <div class="livepull-page">
    <a href="index.html" class="livepull-exit" id="livepull-exit">‹ Home</a>

    <div class="livepull-card">
      <div class="livepull-head">
        <div>
          <div class="livepull-kicker" id="livepull-kicker">Ready to pull</div>
          <select class="livepull-bean-select" id="livepull-bean-select"></select>
        </div>
        <div class="livepull-meta">
          <input type="number" step="0.1" id="livepull-dose" value="18.0" aria-label="Dose weight in grams" />g in<br>
          grind <input type="text" id="livepull-grind" value="—" aria-label="Grind setting" style="width:2.6em;" />
        </div>
      </div>

      <div class="livepull-ring-wrap">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(245,234,216,.14)" stroke-width="9"></circle>
          <circle id="livepull-band-arc" cx="100" cy="100" r="88" fill="none" stroke="#aebf92" stroke-width="15" opacity="0.5"></circle>
          <circle id="livepull-progress-ring" cx="100" cy="100" r="88" fill="none" stroke="#c67139" stroke-width="9" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="552.9"></circle>
        </svg>
        <div class="livepull-ring-face">
          <div class="livepull-elapsed" id="livepull-elapsed">0.0</div>
          <div class="livepull-elapsed-label">seconds</div>
          <div class="livepull-yield-row">
            <input type="number" step="0.1" class="livepull-yield-input" id="livepull-yield" value="0.0" aria-label="Yield weight in grams" />
            <span class="livepull-yield-unit">g out</span>
          </div>
          <div class="livepull-ratio" id="livepull-ratio">—</div>
        </div>
      </div>

      <div class="livepull-status-row">
        <span id="livepull-phase">ready</span>
        <span id="livepull-target-label">target band 25–30 s</span>
      </div>

      <div class="livepull-controls">
        <button type="button" class="livepull-toggle" id="livepull-toggle">Start shot</button>
        <button type="button" class="livepull-reset" id="livepull-reset">Reset</button>
      </div>

      <div class="livepull-taste" id="livepull-taste" hidden>
        <div class="livepull-taste-kicker">Lands after the pour</div>
        <div class="livepull-taste-title">How did it taste?</div>
        <div class="livepull-taste-tags" id="livepull-taste-tags"></div>
        <div class="livepull-save-row">
          <button type="button" class="livepull-save-btn" id="livepull-save-btn">Save shot</button>
          <button type="button" class="livepull-notes-link" id="livepull-notes-btn">or add notes &amp; photo</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud-data.js"></script>
  <script src="js/live-pull.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
