<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The JK Espresso Tracker — Gear</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="app-shell">
    <div class="page-header">
      <div class="eyebrow">Gear</div>
      <h1>Machines, grinders &amp; tools</h1>
      <p class="muted">Browse and search real espresso machines, grinders, and accessories in one place. Prices are approximate — always confirm on the retailer's site.</p>
    </div>

    <div class="toolbar">
      <input type="search" id="search-gear" placeholder="Search gear..." />
      <select id="filter-category">
        <option value="">All categories</option>
        <option value="Machine">Machines</option>
        <option value="Grinder">Grinders</option>
        <option value="Tool">Tools &amp; accessories</option>
      </select>
      <select id="filter-tier">
        <option value="">All price tiers</option>
        <option>Budget</option>
        <option>Budget/Mid</option>
        <option>Mid</option>
        <option>Mid/High</option>
        <option>High-end</option>
        <option>Premium</option>
      </select>
    </div>

    <div class="catalog-grid" id="gear-grid"></div>
  </main>

  <nav id="bottomnav"></nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gear.js"></script>
</body>
</html>
